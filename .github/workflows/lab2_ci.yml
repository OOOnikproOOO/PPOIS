name: CI Lab 2

on:
  push:
    branches: [ main, master, feature-lab2 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  quality:
    name: Build, test, coverage, lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build lcov cppcheck python3-pip
          pip install gcovr

      - name: Configure CMake with coverage
        run: |
          cmake -S lab2 -B lab2/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build lab2/build

      - name: Run tests
        run: ./lab2/build/Tests_Run

      - name: Check coverage
        run: |
          cd lab2
          gcovr --filter "src/.*" --print-summary --fail-under-line 90

      - name: Run cppcheck (static analysis)
        run: |
          cppcheck --enable=warning,performance,portability \
                   --error-exitcode=1 \
                   --inline-suppr \
                   --suppress=missingIncludeSystem \
                   -I lab2/include \
                   lab2/src lab2/app

  release:
    name: Build Windows release and publish
    runs-on: windows-latest
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v2'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -S lab2 -B lab2/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        shell: msys2 {0}
        run: cmake --build lab2/build

      - name: Package artifact
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp lab2/build/Lab2_Run.exe dist/
          cp lab2/build/Tests_Run.exe dist/
          cp /ucrt64/bin/libstdc++-6.dll dist/
          cp /ucrt64/bin/libgcc_s_seh-1.dll dist/
          cp /ucrt64/bin/libwinpthread-1.dll dist/
          cd dist
          powershell -Command "Compress-Archive -Path * -DestinationPath ../lab2-windows.zip -Force"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lab2-windows.zip
          generate_release_notes: true
          tag_name: v1.0-lab2
          name: "Lab 2 — Computer"
          body: |
            Автоматический релиз лабораторной работы №2.
            В архиве: `Lab2_Run.exe`, `Tests_Run.exe` и необходимые DLL.
